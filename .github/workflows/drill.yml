name: fork-drill

# apex-2core is a fleet pool (infra fleet-stack.ts). Naming it rather than
# ubuntu-latest makes "this was leased to pool capacity, not the box" plain in
# the run record: an untrusted job may only ever be leased to a pooled runner.
on:
  push:
  pull_request:

jobs:
  observe:
    runs-on: apex-2core
    steps:
      - name: Where did this code come from
        run: |
          echo "event     = ${{ github.event_name }}"
          echo "base repo = ${{ github.repository }}"
          echo "head repo = ${{ github.event.pull_request.head.repo.full_name }}"

      # BUG-0222 and BUG-0248: GitHub gives a pull request's merge commit and an annotated tag's commit as GITHUB_SHA.
      - name: Which commit is this
        run: |
          echo "GITHUB_REF = ${GITHUB_REF}"
          echo "GITHUB_SHA = ${GITHUB_SHA}"
          echo "head sha   = ${{ github.event.pull_request.head.sha }}"

      - name: Is the repository secret present
        env:
          DRILL_SECRET: ${{ secrets.DRILL_SECRET }}
        run: |
          # Presence only, never the value.
          if [ -z "${DRILL_SECRET}" ]; then
            echo "DRILL_SECRET = absent"
          else
            echo "DRILL_SECRET = PRESENT"
          fi

      - name: Which runner took this job
        run: |
          echo "host = $(hostname)"
          echo "arch = $(uname -m)"
